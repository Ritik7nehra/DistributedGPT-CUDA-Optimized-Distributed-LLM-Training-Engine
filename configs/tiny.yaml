# Smallest config: fast iteration on CPU or a single small GPU (Colab T4/free tier).
model:
  block_size: 128
  n_layer: 4
  n_head: 4
  n_embd: 128
  dropout: 0.1

train:
  batch_size: 16
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 50
  max_steps: 1000
  grad_clip: 1.0
  weight_decay: 0.1
  eval_interval: 100
  amp: true
  grad_accum_steps: 1
